name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install lxml ujson pyquery requests jsonpath cachetools pycryptodome beautifulsoup4 cssselect==1.1.0

    # ★ 新增：云端生成 1x1 透明 PNG
    - name: Create transparent app_bg.png
      run: |
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/drawable/app_bg.png

    - name: Create local.properties
      run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TVBoxOS-Debug-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: warn

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Steven TVBox v1.0.${{ github.run_number }}"
        files: app/build/outputs/apk/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
